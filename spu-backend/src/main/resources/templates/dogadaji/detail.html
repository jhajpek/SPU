<!doctype html>
<html lang="hr" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />

    <title>Sustav za prodaju ulaznica</title>

    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>

  <body>
    <div class="container">
      <div class="top-bar">
        <h1>Sustav za prodaju ulaznica</h1>

        <div class="actions">
          <a class="btn" th:href="@{/dogadaji}"> Događaji </a>

          <a class="btn" th:href="@{/dvorane}"> Dvorane </a>
        </div>
      </div>
      <div th:if="${successMessage}" class="success">
        <span th:text="${successMessage}"></span>
      </div>

      <div th:if="${errorMessage}" class="error">
        <span th:text="${errorMessage}"></span>
      </div>
      <h2 th:text="${dogadaj.naziv}"></h2>

      <div style="margin-top: 25px">
        <p>
          <strong>Kategorija:</strong>

          <span th:text="${dogadaj.kategorija}"></span>
        </p>

        <br />

        <p>
          <strong>Datum održavanja:</strong>

          <span
            th:text="${#temporals.format(dogadaj.datumVrijemeOdrzavanja, 'dd.MM.yyyy. HH:mm')}"
          ></span>
        </p>

        <br />

        <p>
          <strong>Dvorana:</strong>

          <span th:text="${dogadaj.dvorana.naziv}"></span>
        </p>

        <br />

        <p>
          <strong>Lokacija:</strong>

          <span th:text="${dogadaj.dvorana.lokacija.mjesto}"></span>,

          <span th:text="${dogadaj.dvorana.lokacija.ulica}"></span>

          <span th:text="${dogadaj.dvorana.lokacija.kucniBroj}"></span>
        </p>
      </div>
      <div class="actions">
        <a class="btn" th:href="@{/dogadaji}"> Povratak </a>

        <a
          class="btn"
          th:href="@{/dogadaji/edit/{id}(id=${dogadaj.dogadajId})}"
        >
          Uredi događaj
        </a>
      </div>
      <br /><br />
      <hr />
      <h2>Sektori i cjenik</h2>

      <table>
        <thead>
          <tr>
            <th>Sektor</th>
            <th>Cijena</th>
            <th>Prodano</th>
            <th>Akcije</th>
          </tr>
        </thead>

        <tbody>
          <tr th:each="cjenik : ${cjenici}">
            <td th:text="${cjenik.sektor.naziv}"></td>

            <td>
              <div th:id="'view-' + ${cjenik.cjenikId}">
                <span th:text="${cjenik.cijena + ' €'}"></span>

                <button
                  type="button"
                  th:onclick="'toggleEdit(' + ${cjenik.cjenikId} + ')'"
                >
                  Uredi
                </button>
              </div>

              <div th:id="'edit-' + ${cjenik.cjenikId}" style="display: none">
                <form
                  class="actions"
                  th:action="@{/cjenici/edit/{id}(id=${cjenik.cjenikId})}"
                  method="post"
                >
                  <input
                    type="hidden"
                    name="dogadajId"
                    th:value="${dogadaj.dogadajId}"
                  />

                  <input
                    type="hidden"
                    name="sektorId"
                    th:value="${cjenik.sektor.sektorId}"
                  />

                  <input
                    type="number"
                    name="cijena"
                    step="0.01"
                    min="0.01"
                    th:value="${cjenik.cijena}"
                  />

                  <button type="submit">Spremi</button>

                  <button
                    type="button"
                    th:onclick="'toggleEdit(' + ${cjenik.cjenikId} + ')'"
                  >
                    Odustani
                  </button>
                </form>
              </div>
            </td>

            <td>
              <span th:text="${prodaneUlaznice[cjenik.sektor.sektorId]}">
              </span>

              /

              <span th:text="${cjenik.sektor.kapacitet}"> </span>
            </td>

            <td>
              <form
                th:action="@{/cjenici/delete/{id}(id=${cjenik.cjenikId})}"
                method="post"
                onsubmit="return confirm('Jeste li sigurni?');"
              >
                <input
                  type="hidden"
                  name="dogadajId"
                  th:value="${dogadaj.dogadajId}"
                />

                <button type="submit">Ukloni</button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>

      <br />
      <br />

      <div th:if="${!#lists.isEmpty(dostupniSektori)}">
        <h3>Dodaj sektor</h3>
        <br /><br />
        <form th:action="@{/cjenici}" th:object="${noviCjenik}" method="post">
          <input
            type="hidden"
            name="dogadajId"
            th:value="${dogadaj.dogadajId}"
          />

          <div>
            <label>Sektor</label>

            <select th:field="*{sektorId}">
              <option value="">-- Odaberi sektor --</option>

              <option
                th:each="sektor : ${dostupniSektori}"
                th:value="${sektor.sektorId}"
                th:text="${sektor.naziv}"
              ></option>
            </select>
          </div>

          <div>
            <label>Cijena</label>

            <input
              type="number"
              th:field="*{cijena}"
              step="0.01"
              min="0.01"
              required
            />
          </div>

          <br />

          <button type="submit">Dodaj sektor</button>
        </form>
      </div>

      <div th:if="${#lists.isEmpty(dostupniSektori)}">
        <p class="info-message">
          Svi sektori dvorane već su dodani za ovaj događaj.
        </p>
      </div>

      <br />
    </div>
    <script>
      function toggleEdit(id) {
        const view = document.getElementById("view-" + id);

        const edit = document.getElementById("edit-" + id);

        if (edit.style.display === "none") {
          edit.style.display = "block";
          view.style.display = "none";
        } else {
          edit.style.display = "none";
          view.style.display = "block";
        }
      }
    </script>
  </body>
</html>
